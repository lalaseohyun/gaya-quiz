<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>문항별 정답률 · 가야면 실시간 퀴즈</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="../css/base.css" />
<style>
  .rwrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 36px 20px 72px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .rhead { display: flex; flex-direction: column; gap: 8px; }
  .rkicker { color: var(--yellow); font-weight: 800; font-size: 14px; letter-spacing: 0.08em; }
  .rtitle { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  .rsub { color: var(--muted); font-size: 14px; font-weight: 700; }
  .rsection-title { font-size: 15px; font-weight: 800; color: var(--muted); letter-spacing: 0.06em; }
  .rrank { display: flex; flex-direction: column; gap: 8px; }
  .rrank-item {
    background: var(--panel); border-radius: 12px; padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 800; font-size: 17px;
  }
  .rrank-item.top { background: var(--cream); color: var(--ink); }
  .rrank-no { color: var(--muted); font-size: 14px; margin-right: 10px; }
  .rrank-item.top .rrank-no { color: var(--ink); opacity: 0.6; }
  .rtable { width: 100%; border-collapse: collapse; }
  .rtable th, .rtable td { padding: 11px 10px; text-align: left; font-size: 15px; border-bottom: 1px solid var(--line); }
  .rtable th { color: var(--muted); font-size: 13px; font-weight: 800; letter-spacing: 0.05em; }
  .rtable td.num { font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
  .rbar { height: 8px; background: var(--panel); border-radius: 99px; overflow: hidden; min-width: 70px; }
  .rbar span { display: block; height: 100%; background: var(--yellow); }
  .rlow td { color: var(--cream); }
  .rempty { color: var(--muted); font-size: 15px; }
  .rhint { background: var(--panel); border-radius: 12px; padding: 16px 18px; font-size: 14px; line-height: 1.7; color: var(--muted); }
  .rhint b { color: var(--cream); }
</style>
</head>
<body>
<div id="app"><div class="rwrap"><div class="rempty">불러오는 중…</div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/common.js"></script>
<script src="../js/results.js"></script>
</body>
</html>
