<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>가야면 실시간 퀴즈</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="css/base.css" />
<style>
  .home {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 32px;
    text-align: center;
  }
  .home-kicker {
    color: var(--yellow);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.08em;
  }
  .home-title {
    font-size: clamp(26px, 5vw, 44px);
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .home-links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 360px;
  }
  .home-links a {
    background: var(--panel);
    color: var(--on-stage);
    text-decoration: none;
    border-radius: 14px;
    padding: 18px 22px;
    font-size: 18px;
    font-weight: 800;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .home-links a.primary {
    background: var(--yellow);
    color: var(--ink);
  }
  .home-note {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
    max-width: 30em;
  }
</style>
</head>
<body>
<div class="home">
  <div class="home-kicker">가야면 1차 주민워크숍</div>
  <h1 class="home-title">가야면 10년 계획,<br />뭐라고 쓰여 있나</h1>
  <div class="home-links">
    <a class="primary" href="host/?k=gaya2026">진행자 화면 <span>→</span></a>
    <a href="play/?k=gaya2026">팀 화면 <span>→</span></a>
  </div>
  <p class="home-note">
    참가자는 진행자 화면의 대기화면에 뜨는 QR을 찍으면 됩니다.<br />
    진행은 진행자 화면의 큰 버튼(또는 Space) 하나로 끝까지 갑니다.
  </p>
</div>
</body>
</html>
